global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'campus-mate-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'

  - job_name: 'campus-mate-auth'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'campus-mate-chat'
    static_configs:
      - targets: ['chat-service:3002']
    metrics_path: '/metrics'

  - job_name: 'campus-mate-data'
    static_configs:
      - targets: ['data-service:3003']
    metrics_path: '/metrics'

  - job_name: 'campus-mate-analytics'
    static_configs:
      - targets: ['analytics-service:3004']
    metrics_path: '/metrics'

  - job_name: 'campus-mate-memory'
    static_configs:
      - targets: ['memory-service:3005']
    metrics_path: '/metrics'

  - job_name: 'campus-mate-webhooks'
    static_configs:
      - targets: ['webhooks-service:3006']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
