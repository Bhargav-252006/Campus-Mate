server {
    listen 80;
    server_name _;

    # Root directory (Vite production build)
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1000;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy → API Gateway (strips /api prefix)
    location /api/ {
        # Re-resolve Docker DNS to avoid stale upstream IPs when containers restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_gateway http://api-gateway:3000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — serve index.html for all React routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden/sensitive files
    location ~ /\. {
        deny all;
    }
}
