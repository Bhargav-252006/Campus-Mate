name: Campus Mate CD

on:
  workflow_run:
    workflows: ["Campus Mate CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [gateway, auth, chat, data, analytics, memory, webhooks]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: deploy_secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.DEPLOY_URL }}" ] && [ -n "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets found."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets missing. Skipping deploy step."
          fi

      - name: Deploy using webhook
        if: steps.deploy_secrets.outputs.ready == 'true'
        run: |
          curl -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.event.workflow_run.head_sha || github.sha }}"}'
