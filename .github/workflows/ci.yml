name: Campus Mate CI

on:
  push:
    branches: [main, v2-architecture]
  pull_request:
    branches: [main, v2-architecture]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Run server tests (if present)
        run: npm test --prefix server --if-present

      - name: Run server lint (if present)
        run: npm run lint --prefix server --if-present

      - name: Build frontend
        run: npm run build --prefix client

      - name: DB connectivity check
        run: node server/scripts/check-db.js "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"

      - name: Redis connectivity check
        run: node server/scripts/check-redis.js
        env:
          REDIS_URL: redis://localhost:6379
