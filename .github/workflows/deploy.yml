name: Campus Mate CI and Deploy

on:
  push:
    branches: [ main, v2-architecture ]
  pull_request:
    branches: [ main, v2-architecture ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          server/package-lock.json
          client/package-lock.json

    - name: Install workspace dependencies
      run: |
        npm ci
        npm ci --prefix server
        npm ci --prefix client

    - name: Run server tests (if present)
      run: npm test --prefix server --if-present

    - name: Run server lint (if present)
      run: npm run lint --prefix server --if-present

    - name: Build frontend
      run: npm run build --prefix client

    - name: DB connectivity check
      run: node server/scripts/check-db.js "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"

    - name: Redis connectivity check
      run: node server/scripts/check-redis.js
      env:
        REDIS_URL: redis://localhost:6379

  build-and-push:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [gateway, auth, chat, data, analytics, memory, webhooks]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile.${{ matrix.service }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DEPLOY_URL != '' && secrets.DEPLOY_TOKEN != ''

    steps:
    - uses: actions/checkout@v4

    - name: Deploy using webhook
      run: |
        curl -X POST "${{ secrets.DEPLOY_URL }}" \
          -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"ref":"${{ github.sha }}"}'
